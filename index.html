<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NO LIMITS</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=__CACHEBUST__">
  <script>
    document.querySelector('link[href*="__CACHEBUST__"]').href = 'style.css?v=' + Date.now();
  </script>
</head>
<body>
  <div id="app">
    <div class="header">
      <h1>N O &nbsp; L I M I T S</h1>
      <div id="app-version" style="font-size:10px;color:#555;text-align:center"></div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="generate">INPAINT</button>
      <button class="tab" data-tab="profile">PROFILE</button>
      <button class="tab" data-tab="voice">VOICE</button>
      <button class="tab admin-only" data-tab="admin" style="display:none">ADMIN</button>
    </div>

    <!-- Inpaint Page -->
    <div id="page-generate" class="page">
      <div class="card">
        <label class="label">PHOTO</label>
        <div class="upload-zone" id="inp-upload" onclick="pickPhoto('inp')">
          <span class="upload-plus">+</span>
          <span class="upload-text">Tap to upload or paste</span>
        </div>
      </div>
      <div id="inp-after-photo" style="display:none">
        <div class="card">
          <label class="label">MASK</label>
          <canvas id="mask-canvas" class="mask-canvas"></canvas>
          <div class="brush-tools">
            <button class="brush-btn active" data-group="brush" data-val="brush">Brush</button>
            <button class="brush-btn" data-group="brush" data-val="eraser">Eraser</button>
            <button class="brush-btn" onclick="clearMask()">Clear</button>
            <span class="brush-size-label">Size: <span id="brush-size-val">20</span>px</span>
            <input type="range" class="slider-sm" id="brush-size" min="5" max="80" value="20">
          </div>
        </div>
        <div class="card">
          <label class="label">PROMPT</label>
          <div class="tags">
            <button class="tag" onclick="setPreset('name_lipstick')">💄 Name</button>
            <button class="tag" onclick="setPreset('name_marker')">🖊️ Name</button>
            <button class="tag nsfw-tag" onclick="setPreset('nude')">Nude</button>
          </div>
          <textarea id="inp-prompt" class="input-area" placeholder="Describe what to paint in the mask..."></textarea>

        </div>
        <div class="card">
          <label class="label">NEGATIVE</label>
          <textarea id="inp-negative" class="input-area small">tattoo, sticker, marker, sharpie, felt-tip pen, airbrush, cgi, 3d render, illustration, vector art, cartoon, smooth plastic skin, fake skin, mannequin, deformed letters, crooked text, low contrast, blur, watermark, signature, dirty skin (if not desired), scars, bruises, masculine features, hairy skin.</textarea>
        </div>
        <div class="card row">
          <div class="half">
            <label class="label">CFG: <span id="inp-cfg-val">3</span></label>
            <input type="range" class="slider" id="inp-cfg" min="1" max="10" step="0.5" value="3">
          </div>
          <div class="half">
            <label class="label">STEPS: <span id="inp-steps-val">15</span></label>
            <input type="range" class="slider" id="inp-steps" min="5" max="50" step="5" value="15">
          </div>
        </div>
        <button class="btn-main" onclick="generate()">G E N E R A T E</button>
      </div>
    </div>

    <!-- Voice Page -->
    <div id="page-voice" class="page" style="display:none">
      <div class="card">
        <label class="label">WHAT TO SAY</label>
        <textarea id="voice-text" class="input-area" placeholder="Type your text here... Use [laugh], [sigh], [whisper] for effects" style="min-height:100px"></textarea>
        <div style="font-size:11px;color:#555;margin-top:4px"><span id="voice-char-count">0</span>/5000 characters</div>
      </div>

      <div class="card">
        <label class="label">EFFECTS <button class="vtag-lang-toggle" onclick="toggleVoiceLang()">EN</button></label>
      </div>

      <div class="card">
        <label class="label sub-label">INSERT AT CURSOR</label>
        <div class="voice-tags">
          <button class="vtag" onclick="insertVoiceTag('... ')">пауза</button>
          <button class="vtag" onclick="insertVoiceTag('... ... ... ')">долгая пауза</button>
          <button class="vtag" onclick="insertVoiceTag('*laughs* ')">смех</button>
          <button class="vtag" onclick="insertVoiceTag('*chuckles* heh, ')">смешок</button>
          <button class="vtag" onclick="insertVoiceTag('hehe, ')">хихик</button>
          <button class="vtag" onclick="insertVoiceTag('*sobbing* ')">плач</button>
          <button class="vtag" onclick="insertVoiceTag('*sighs* ')">вздох</button>
          <button class="vtag" onclick="insertVoiceTag('tsk, ')">цк</button>
          <button class="vtag" onclick="insertVoiceTag('*click* ')">щелчок</button>
          <button class="vtag" onclick="insertVoiceTag('mwah, ')">чмок</button>
          <button class="vtag" onclick="insertVoiceTag('hmm... ')">хм</button>
          <button class="vtag" onclick="insertVoiceTag('*breathes* ')">дыхание</button>
          <button class="vtag" onclick="insertVoiceTag('*inhales deeply* ')">вдох</button>
          <button class="vtag" onclick="insertVoiceTag('*exhales* ')">выдох</button>
        </div>
      </div>

      <div class="card">
        <label class="label sub-label">EFFECTS <span style="opacity:0.5;font-size:0.75em">add 1-2 tags before text</span></label>
        <div class="voice-tags">
          <button class="vtag vtag-wrap" onclick="wrapVoiceTag('(excitedly)')">возбуждённо</button>
          <button class="vtag vtag-wrap" onclick="wrapVoiceTag('(whispering)')">шёпот</button>
          <button class="vtag vtag-wrap" onclick="wrapVoiceTag('(softly)')">мягко</button>
          <button class="vtag vtag-wrap" onclick="wrapVoiceTag('(loudly)')">громко</button>
          <button class="vtag vtag-wrap" onclick="wrapVoiceTag('(with rising intensity)')">нарастание</button>
          <button class="vtag vtag-wrap" onclick="wrapVoiceTag('(fading)')">затухание</button>
          <button class="vtag vtag-wrap" onclick="wrapVoiceTag('(in a higher voice)')">выше тон</button>
          <button class="vtag vtag-wrap" onclick="wrapVoiceTag('(in a deeper voice)')">ниже тон</button>
          <button class="vtag vtag-wrap" onclick="wrapVoiceTag('(slowly)')">медленно</button>
          <button class="vtag vtag-wrap" onclick="wrapVoiceTag('(quickly)')">быстро</button>
          <button class="vtag vtag-wrap" onclick="wrapVoiceTag('(emphasizing)')">акцент</button>
          <button class="vtag vtag-wrap" onclick="wrapVoiceTag('(playfully)')">игриво</button>
          <button class="vtag vtag-wrap" onclick="wrapVoiceTag('(seductively)')">соблазн</button>
          <button class="vtag vtag-wrap" onclick="wrapVoiceTag('(laughing while saying)')">смех-речь</button>
        </div>
      </div>

      <div class="card">
        <label class="label">LANGUAGE</label>
        <select id="voice-lang" class="voice-select">
          <option value="en">🇬🇧 English</option>
          <option value="ru">🇷🇺 Russian</option>
          <option value="zh">🇨🇳 Chinese</option>
          <option value="ja">🇯🇵 Japanese</option>
          <option value="ko">🇰🇷 Korean</option>
          <option value="de">🇩🇪 German</option>
          <option value="fr">🇫🇷 French</option>
          <option value="es">🇪🇸 Spanish</option>
          <option value="it">🇮🇹 Italian</option>
          <option value="pt">🇧🇷 Portuguese</option>
          <option value="tr">🇹🇷 Turkish</option>
          <option value="ar">🇸🇦 Arabic</option>
          <option value="hi">🇮🇳 Hindi</option>
        </select>
      </div>

      <button class="btn-main btn-voice" onclick="generateVoice()">G E N E R A T E &nbsp; V O I C E</button>
    </div>

    <!-- Admin Page -->
    <div id="page-admin" class="page" style="display:none">
      <div class="card">
        <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
          <input type="text" id="admin-search" placeholder="ID or username..." style="flex:1;background:#18181b;border:1px solid #27272a;border-radius:10px;color:#d4d4d8;padding:10px 14px;font-size:14px;outline:none;font-family:inherit">
          <button class="btn-sm btn-ok" style="padding:10px 14px;font-size:11px;white-space:nowrap" onclick="searchUsers()">GO</button>
        </div>
        <div id="admin-user-list" class="admin-user-list">
          <div class="dim-text" style="text-align:center;padding:20px">Press SEARCH or load all users</div>
        </div>
      </div>
    </div>

    <!-- Profile Page -->
    <div id="page-profile" class="page" style="display:none">
      <div class="card profile-stats">
        <div class="stat stat-clickable" onclick="openHistory()">
          <span class="stat-num" id="stat-gens">0</span>
          <span class="stat-label">GENERATIONS</span>
        </div>
        <div class="stat">
          <span class="stat-num" id="stat-premium">—</span>
          <span class="stat-label">PREMIUM</span>
        </div>
      </div>
      <div class="card" id="premium-promo" style="display:none">
        <label class="label">PREMIUM REQUIRED</label>
        <p class="dim-text">Image generation is available only with an active Premium subscription.</p>
        <button class="btn-premium" onclick="buyPremium()">BUY PREMIUM 30 DAYS<span>1500 Stars</span></button>
      </div>
      <div class="card" id="premium-active" style="display:none">
        <label class="label">PREMIUM</label>
        <p class="dim-text">Your Premium is active. Unlimited generations!</p>
      </div>
    </div>
  </div>

  <!-- Result Overlay -->
  <div id="result-overlay" class="result-overlay" style="display:none">
    <div class="result-panel">
      <div class="result-header">
        <span class="result-title">RESULT</span>
        <button class="result-close" onclick="closeResult()">&times;</button>
      </div>
      <div id="result-content" class="result-content"></div>
      <div class="result-actions">
        <button class="btn-main" onclick="regenerate()">R E G E N E R A T E</button>
      </div>
    </div>
  </div>

  <!-- Progress Overlay -->
  <div id="progress-overlay" class="progress-overlay" style="display:none">
    <div class="progress-panel">
      <div id="progress-status" class="progress-status">Preparing...</div>
      <div class="progress-bar-track">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width:0%"></div>
      </div>
      <div id="progress-pct" class="progress-pct">0%</div>
      <div id="progress-time" class="progress-time"></div>
    </div>
  </div>

  <!-- History Modal -->
  <div id="history-modal" class="history-modal" style="display:none">
    <div class="history-panel">
      <div class="result-header">
        <span class="result-title">HISTORY</span>
        <button class="result-close" onclick="closeHistory()">&times;</button>
      </div>
      <div id="history-list" class="history-list">
        <div class="dim-text" style="text-align:center;padding:40px">No generations yet</div>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/*" style="display:none">
  <script>
    (function() {
      const s = document.createElement('script');
      s.src = 'app2.js?v=' + Date.now();
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
